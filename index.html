<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noche de Estrellas</title>
<style>
  :root{
    --bg:#05050c;
    --bg2:#0b0b1a;
    --gold:#f6c945;
    --gold-deep:#e8a72e;
    --petal:#ffd23f;
    --leaf:#3f7d3a;
    --leaf-dark:#2c5a28;
    --star:#ffffff;
    --white:#fdfaf3;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    overflow-x:hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
  }
  body{
    min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .sky{
    position:relative;
    min-height:100vh;
    width:100%;
    background: radial-gradient(ellipse at 50% 0%, var(--bg2) 0%, var(--bg) 65%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    overflow:hidden;
  }

  .stars, .stars2, .stars3{
    position:absolute; inset:0;
    background-repeat:repeat;
    pointer-events:none;
  }
  .stars{ background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, var(--star), transparent),
      radial-gradient(1px 1px at 40% 40%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, var(--star), transparent),
      radial-gradient(1px 1px at 90% 60%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 25% 80%, var(--star), transparent),
      radial-gradient(1px 1px at 50% 15%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 15% 55%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 70% 30%, var(--star), transparent),
      radial-gradient(1px 1px at 95% 85%, var(--star), transparent);
    background-size:250px 250px;
    animation: twinkle 3.5s ease-in-out infinite alternate;
  }
  .stars2{ background-image:
      radial-gradient(1px 1px at 30% 30%, var(--star), transparent),
      radial-gradient(1px 1px at 55% 60%, var(--star), transparent),
      radial-gradient(1px 1px at 75% 20%, var(--star), transparent),
      radial-gradient(1px 1px at 5% 70%, var(--star), transparent),
      radial-gradient(1px 1px at 88% 45%, var(--star), transparent);
    background-size:180px 180px;
    animation: twinkle 4.5s ease-in-out infinite alternate-reverse;
  }
  .stars3{
    background-image: radial-gradient(2px 2px at 20% 25%, var(--gold), transparent),
      radial-gradient(2px 2px at 65% 15%, var(--gold), transparent),
      radial-gradient(2px 2px at 85% 55%, var(--gold), transparent),
      radial-gradient(2px 2px at 12% 65%, var(--gold), transparent);
    background-size:400px 400px;
    animation: twinkle 5.5s ease-in-out infinite alternate;
    opacity:.7;
  }
  @keyframes twinkle{
    0%{opacity:.35;}
    100%{opacity:1;}
  }

  .glow{
    position:absolute;
    top:8%; left:50%;
    transform:translateX(-50%);
    width:min(70vw,480px); height:min(70vw,480px);
    background: radial-gradient(circle, rgba(246,201,69,0.18) 0%, rgba(246,201,69,0.05) 45%, transparent 70%);
    filter: blur(2px);
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:2;
    width:100%;
    max-width:640px;
    padding:0 24px 8vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  h1{
    color:var(--white);
    font-weight:400;
    letter-spacing:.03em;
    font-size:clamp(1.6rem,5vw,2.4rem);
    margin: 6vh 0 0;
    text-shadow: 0 0 18px rgba(246,201,69,0.35);
  }
  .sub{
    color:#cfc9b8;
    font-size:.95rem;
    margin:.4em 0 2vh;
    font-style:italic;
  }

  .stage{
    position:relative;
    width:min(88vw,420px);
    margin-top:2vh;
  }

  /* --- espacio para imagen --- */
  .photo-slot{
    width:62%;
    aspect-ratio: 3 / 4;
    margin:0 auto;
    border:1.5px dashed rgba(246,201,69,0.55);
    border-radius:12px;
    background: rgba(255,255,255,0.03);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:16px;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.4));
    animation: bob 4s ease-in-out infinite;
    overflow:hidden;
  }
  .photo-slot img{
    width:100%; height:100%;
    object-fit:contain;
  }
  .photo-hint{
    color:#8b8672;
    font-size:.8rem;
    font-style:italic;
    line-height:1.5;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }

  /* --- campo de flores de fondo, todo el ancho --- */
  .field{
    position:absolute;
    left:0; right:0; bottom:0;
    height:16vh;
    min-height:110px;
    z-index:1;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:0 2%;
    pointer-events:none;
    opacity:.85;
  }
  .field svg{
    height:100%;
    flex:0 0 auto;
    transform-origin:bottom center;
    animation: sway 5s ease-in-out infinite;
  }
  .field svg:nth-child(odd){ animation-delay:.4s; }
  .field svg:nth-child(3n){ animation-delay:.9s; }
  .field svg:nth-child(4n){ height:70%; }
  .field svg:nth-child(5n){ height:85%; }

  /* --- girasoles / flores --- */
  .flowerbed{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:2%;
    margin-top:-6%;
    width:100%;
  }
  .flower{
    width:20%;
    max-width:90px;
    transform-origin:bottom center;
    animation: sway 5s ease-in-out infinite;
  }
  .flower.f2{ animation-delay:.6s; width:26%; max-width:110px; }
  .flower.f3{ animation-delay:1.2s; }
  .flower.f4{ animation-delay:.3s; width:16%; max-width:70px; }
  @keyframes sway{
    0%,100%{ transform: rotate(-3deg); }
    50%{ transform: rotate(3deg); }
  }

  footer{
    position:relative;
    z-index:2;
    color:#8b8672;
    font-size:.78rem;
    text-align:center;
    padding: 2vh 20px calc(3vh + env(safe-area-inset-bottom,0px));
    letter-spacing:.02em;
  }
  footer span{ color:var(--gold); }

  @media (prefers-reduced-motion: reduce){
    .dog, .flower, .stars, .stars2, .stars3{ animation:none !important; }
  }
</style>
</head>
<body>
<div class="sky">
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>
  <div class="glow"></div>
  <div class="field" id="field"></div>

  <div class="content">
    <h1>Buenas noches, Daniel</h1>
    <p class="sub">una noche estrellada, para ti</p>

    <div class="stage">
      <div class="photo-slot">
      <img src="snoopy.png" alt="perrito" style="width:100%; max-width:200px; display:block; margin:0 auto 2vh; filter: drop-shadow(0 10px 18px rgba(0,0,0,.4));">
</span>
      </div>

      <div class="flowerbed">
        <!-- Girasoles / flores amarillas SVG -->
        <svg class="flower f1" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
          <line x1="50" y1="70" x2="50" y2="140" stroke="#2c5a28" stroke-width="4"/>
          <path d="M50 100 Q30 110 26 128" stroke="#2c5a28" stroke-width="3" fill="none"/>
          <ellipse cx="24" cy="130" rx="10" ry="5" fill="#3f7d3a" transform="rotate(-20 24 130)"/>
          <g>
            <g id="petals1">
              <ellipse cx="50" cy="40" rx="8" ry="18" fill="#ffd23f"/>
            </g>
            <use href="#petals1" transform="rotate(30 50 60)"/>
            <use href="#petals1" transform="rotate(60 50 60)"/>
            <use href="#petals1" transform="rotate(90 50 60)"/>
            <use href="#petals1" transform="rotate(120 50 60)"/>
            <use href="#petals1" transform="rotate(150 50 60)"/>
            <use href="#petals1" transform="rotate(180 50 60)"/>
            <use href="#petals1" transform="rotate(210 50 60)"/>
            <use href="#petals1" transform="rotate(240 50 60)"/>
            <use href="#petals1" transform="rotate(270 50 60)"/>
            <use href="#petals1" transform="rotate(300 50 60)"/>
            <use href="#petals1" transform="rotate(330 50 60)"/>
          </g>
          <circle cx="50" cy="60" r="16" fill="#8a5a22"/>
          <circle cx="50" cy="60" r="16" fill="url(#seedgrad)"/>
        </svg>

        <svg class="flower f2" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="seedgrad" cx="40%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#a9722f"/>
              <stop offset="100%" stop-color="#6b4a1e"/>
            </radialGradient>
          </defs>
          <line x1="50" y1="66" x2="50" y2="140" stroke="#2c5a28" stroke-width="5"/>
          <path d="M50 95 Q75 100 82 122" stroke="#2c5a28" stroke-width="3.5" fill="none"/>
          <ellipse cx="84" cy="124" rx="12" ry="6" fill="#3f7d3a" transform="rotate(20 84 124)"/>
          <path d="M50 105 Q22 108 15 130" stroke="#2c5a28" stroke-width="3.5" fill="none"/>
          <ellipse cx="13" cy="132" rx="12" ry="6" fill="#3f7d3a" transform="rotate(-25 13 132)"/>
          <g>
            <g id="petals2">
              <ellipse cx="50" cy="30" rx="9" ry="20" fill="#f6c945"/>
            </g>
            <use href="#petals2" transform="rotate(30 50 55)"/>
            <use href="#petals2" transform="rotate(60 50 55)"/>
            <use href="#petals2" transform="rotate(90 50 55)"/>
            <use href="#petals2" transform="rotate(120 50 55)"/>
            <use href="#petals2" transform="rotate(150 50 55)"/>
            <use href="#petals2" transform="rotate(180 50 55)"/>
            <use href="#petals2" transform="rotate(210 50 55)"/>
            <use href="#petals2" transform="rotate(240 50 55)"/>
            <use href="#petals2" transform="rotate(270 50 55)"/>
            <use href="#petals2" transform="rotate(300 50 55)"/>
            <use href="#petals2" transform="rotate(330 50 55)"/>
          </g>
          <circle cx="50" cy="55" r="18" fill="url(#seedgrad)"/>
        </svg>

        <svg class="flower f3" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
          <line x1="50" y1="72" x2="50" y2="140" stroke="#2c5a28" stroke-width="4"/>
          <path d="M50 100 Q72 108 78 128" stroke="#2c5a28" stroke-width="3" fill="none"/>
          <ellipse cx="80" cy="130" rx="10" ry="5" fill="#3f7d3a" transform="rotate(20 80 130)"/>
          <g>
            <g id="petals3">
              <ellipse cx="50" cy="42" rx="7" ry="16" fill="#ffd23f"/>
            </g>
            <use href="#petals3" transform="rotate(36 50 62)"/>
            <use href="#petals3" transform="rotate(72 50 62)"/>
            <use href="#petals3" transform="rotate(108 50 62)"/>
            <use href="#petals3" transform="rotate(144 50 62)"/>
            <use href="#petals3" transform="rotate(180 50 62)"/>
            <use href="#petals3" transform="rotate(216 50 62)"/>
            <use href="#petals3" transform="rotate(252 50 62)"/>
            <use href="#petals3" transform="rotate(288 50 62)"/>
            <use href="#petals3" transform="rotate(324 50 62)"/>
          </g>
          <circle cx="50" cy="62" r="14" fill="#8a5a22"/>
        </svg>

        <svg class="flower f4" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">
          <line x1="50" y1="76" x2="50" y2="140" stroke="#2c5a28" stroke-width="4"/>
          <g>
            <g id="petals4">
              <ellipse cx="50" cy="48" rx="6" ry="14" fill="#f6c945"/>
            </g>
            <use href="#petals4" transform="rotate(36 50 66)"/>
            <use href="#petals4" transform="rotate(72 50 66)"/>
            <use href="#petals4" transform="rotate(108 50 66)"/>
            <use href="#petals4" transform="rotate(144 50 66)"/>
            <use href="#petals4" transform="rotate(180 50 66)"/>
            <use href="#petals4" transform="rotate(216 50 66)"/>
            <use href="#petals4" transform="rotate(252 50 66)"/>
            <use href="#petals4" transform="rotate(288 50 66)"/>
            <use href="#petals4" transform="rotate(324 50 66)"/>
          </g>
          <circle cx="50" cy="66" r="12" fill="#8a5a22"/>
        </svg>
      </div>
    </div>
  </div>

  <footer>hecho con cariño para <span>Daniel</span> 🌻</footer>
</div>

<script>
(function(){
  var field = document.getElementById('field');
  var yellows = ['#ffd23f', '#f6c945', '#f2b90e', '#e8a72e'];
  var count = 26;
  var svgs = '';
  for (var i = 0; i < count; i++){
    var petalColor = yellows[i % yellows.length];
    var seedSize = 4 + Math.random()*2;
    var rot = (Math.random()*10 - 5).toFixed(1);
    var stemH = 40 + Math.random()*20;
    svgs += '<svg viewBox="0 0 40 70" style="transform:rotate(' + rot + 'deg)">' +
      '<line x1="20" y1="' + (70-stemH) + '" x2="20" y2="70" stroke="#2c5a28" stroke-width="2.2"/>' +
      '<g>' +
        '<g id="p' + i + '"><ellipse cx="20" cy="' + (70-stemH-2) + '" rx="4" ry="9" fill="' + petalColor + '"/></g>' +
        '<use href="#p' + i + '" transform="rotate(45 20 ' + (70-stemH+8) + ')"/>' +
        '<use href="#p' + i + '" transform="rotate(90 20 ' + (70-stemH+8) + ')"/>' +
        '<use href="#p' + i + '" transform="rotate(135 20 ' + (70-stemH+8) + ')"/>' +
        '<use href="#p' + i + '" transform="rotate(180 20 ' + (70-stemH+8) + ')"/>' +
        '<use href="#p' + i + '" transform="rotate(225 20 ' + (70-stemH+8) + ')"/>' +
        '<use href="#p' + i + '" transform="rotate(270 20 ' + (70-stemH+8) + ')"/>' +
        '<use href="#p' + i + '" transform="rotate(315 20 ' + (70-stemH+8) + ')"/>' +
      '</g>' +
      '<circle cx="20" cy="' + (70-stemH+8) + '" r="' + seedSize + '" fill="#8a5a22"/>' +
    '</svg>';
  }
  field.innerHTML = svgs;
})();
</script>
</body>
</html>
